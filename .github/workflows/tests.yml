name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: deterministic Linux gate (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The suite is hermetic: no third-party packages, no network, no model
      # calls, no provider credentials. It uses local stubs for every external
      # CLI, so it must pass on a clean runner with nothing installed.
      - name: Run the authoritative gate
        run: ./tests/run-tests.sh

      - name: Check shell syntax
        run: find scripts tests -type f -name '*.sh' -exec bash -n {} +

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      # Preflight must degrade gracefully when no provider CLI exists at all.
      # A missing optional adapter is a reported capability gap, not a crash.
      - name: Preflight reports missing tools without crashing
        run: |
          set +e
          ./scripts/efo_preflight.py --json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "preflight exited $status; expected 0 or 1" >&2
            exit 1
          fi

      - name: Install is a no-op under --dry-run
        run: |
          ./scripts/install.sh --prefix "$RUNNER_TEMP/bin" --dry-run
          if [ -e "$RUNNER_TEMP/bin/efo-orchestrate" ]; then
            echo "--dry-run created files" >&2
            exit 1
          fi
